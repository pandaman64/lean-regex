name: CodSpeed Benchmarks

on:
  push:
    branches:
      - main
  pull_request:
  # CodSpeed uses this to backfill the first measurements.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: regexvibe

      - name: Setup Rust toolchain, cache and cargo-codspeed
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed

      - name: Build the benchmark target
        working-directory: bench
        run: cargo codspeed build

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          working-directory: bench
          run: cargo codspeed run

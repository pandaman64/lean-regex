name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build Documentation
    # doc-gen4 peaks near the standard runner's 16 GB. ubuntu-latest is Ubuntu 26.04,
    # which does not provide the swap the 24.04 image did, so this job dies with
    # "resource exhausted (error code: 12, not enough memory)" on *:srcUri.github.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Build RegexCorrectness
        uses: leanprover/lean-action@v1
        with:
          build-args: '--wfail'
          lake-package-directory: correctness

      # Own swap, independent of what the runner image ships. /mnt is preferred
      # when that volume exists; otherwise fall back to the root disk.
      - name: Add swap for documentation build
        run: |
          SWAP=/mnt/swapfile-docs
          sudo fallocate -l 8G "$SWAP" 2>/dev/null || { SWAP=/swapfile-docs; sudo fallocate -l 8G "$SWAP"; }
          sudo chmod 600 "$SWAP"
          sudo mkswap "$SWAP"
          sudo swapon "$SWAP"
          swapon --show
          free -h

      - name: Build Documentation
        working-directory: docbuild
        run: lake build --keep-toolchain Regex:docs RegexCorrectness:docs
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docbuild/.lake/build/doc'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
